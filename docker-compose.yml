version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: qingpu_postgres
    environment:
      POSTGRES_DB: qingpu_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qingpu_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: qingpu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 跳过 MinerU 模型下载（如果模型已缓存则设为 "1"）
        SKIP_MINERU_SETUP: "0"
    container_name: qingpu_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/qingpu_ai
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ADMIN_REGISTRATION_CODE=${ADMIN_REGISTRATION_CODE}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE}
      - ENV=development
      - MINERU_OUTPUT_DIR=/app/data/mineru_output
      - UPLOAD_DIR=/app/data/raw
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      # MinerU 模型缓存（持久化，避免每次 build 重新下载）
      - mineru_models:/root/.cache/mineru
      - mineru_hf_cache:/root/.cache/huggingface
      - mineru_modelscope_cache:/root/.cache/modelscope
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qingpu_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  # MinerU 模型缓存卷
  mineru_models:
  mineru_hf_cache:
  mineru_modelscope_cache:
